server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
spring:
  sql.init.mode: always
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/rehab;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  jackson:
    deserialization:
      fail-on-unknown-properties: true
app:
  zone: ${APP_ZONE:Europe/Moscow}
  demo-data: ${DEMO_DATA:true}
  admin-password: ${ADMIN_PASSWORD:Admin2026!}
  specialist-password: ${SPECIALIST_PASSWORD:Doctor2026!}
  patient-password: ${PATIENT_PASSWORD:Patient2026!}
springdoc:
  swagger-ui:
    csrf:
      enabled: true
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN
